<body>
<div class="app"><div class="top"><div class="brand">PHOENIX</div><div class="top-actions"><div id="progress" class="progress">Séance 01</div><button id="sessionMenu" class="session-menu-trigger" onclick="openSessionMenu()" aria-label="Menu de la séance" hidden>•••</button></div></div><main id="main" class="hero"></main><div id="nav" class="nav"></div><div id="hint" class="hint"></div></div>
<main id="libraryRoot" class="library-shell" hidden></main>
<div id="sessionMenuOverlay" class="session-overlay" hidden><div class="session-sheet" role="dialog" aria-modal="true" aria-label="Menu de la séance"><div class="session-sheet-title">Séance PHOENIX</div><button class="session-end-command" onclick="requestEndConfirmation()">Terminer la séance</button><button class="session-sheet-close" onclick="closeSessionMenu()">Fermer</button></div></div>
<div id="sessionConfirm" class="session-overlay" hidden><div class="session-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="sessionConfirmTitle" aria-describedby="sessionConfirmText"><h2 id="sessionConfirmTitle">Mettre fin à la séance ?</h2><p id="sessionConfirmText">La séance en cours sera arrêtée.</p><div class="session-confirm-actions"><button class="confirm-continue" onclick="continueSession()">Continuer</button><button class="confirm-end" onclick="terminateSession()">Terminer</button></div></div></div>
<div id="full" class="fullscreen" role="dialog" aria-modal="true" aria-label="Illustration du mouvement"><button class="close" onclick="closeFull()" aria-label="Fermer l’illustration">Fermer</button><img id="fullImg" alt="Illustration du mouvement agrandie"><svg id="fullAnnotations" class="fullscreen-annotations" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
